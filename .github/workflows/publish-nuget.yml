name: Publish NuGet Package

on:
  release:
    types: [published] # Triggers automatically when you hit "Publish Release" on GitHub

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Crucial: Allows the runner to push to your GitHub Packages tab

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # Setup both SDKs since your project explicitly targets net9.0 and net10.0
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Project
        run: dotnet build --configuration Release --no-restore

      # Packs code into a .nupkg file using the version from the Release Tag
      - name: Pack NuGet Package
        run: |
          VERSION=${{ github.event.release.tag_name }}
          VERSION=${VERSION#v} # Strips the "v" prefix if present (e.g., v2.20.1 becomes 2.20.1)
          dotnet pack --configuration Release --no-build --output ./dist /p:PackageVersion=$VERSION

      # Authenticates and pushes the package straight to repository package registry
      - name: Publish to GitHub Packages
        run: |
          dotnet nuget add source "https://github.com{{ github.repository_owner }}/index.json" \
            --name "GitHub" \
            --username "${{ github.repository_owner }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

          dotnet nuget push ./dist/*.nupkg --source "GitHub" --skip-duplicate
