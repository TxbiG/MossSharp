name: Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-native:
    name: Build ${{ matrix.rid }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-13
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout MossSharp
        uses: actions/checkout@v4
        with:
          path: MossSharp

      - name: Checkout Moss
        uses: actions/checkout@v4
        with:
          repository: TxbiG/Moss
          path: Moss
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgl1-mesa-dev \
            libvulkan-dev \
            mesa-vulkan-drivers \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Configure Moss
        working-directory: Moss
        run: >
          cmake
          -S .
          -B build
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build Moss
        working-directory: Moss
        run: cmake --build build --config Release --parallel

      - name: Locate native library
        working-directory: Moss
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows)
              find build -type f \( -iname "*.dll" \) -print
              ;;
            Linux)
              find build -type f \( -name "*.so" -o -name "*.so.*" \) -print
              ;;
            macOS)
              find build -type f \( -name "*.dylib" \) -print
              ;;
          esac

      - name: Copy native library
        working-directory: MossSharp
        shell: bash
        run: |
          mkdir -p "runtimes/${{ matrix.rid }}/native"

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp ../Moss/build/Release/moss.dll \
              "runtimes/${{ matrix.rid }}/native/"
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            cp ../Moss/build/libmoss.so \
              "runtimes/${{ matrix.rid }}/native/"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            cp ../Moss/build/libmoss.dylib \
              "runtimes/${{ matrix.rid }}/native/"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        working-directory: MossSharp
        run: dotnet restore

      - name: Build MossSharp
        working-directory: MossSharp
        run: dotnet build -c Release --no-restore

      - name: Test MossSharp
        working-directory: MossSharp
        run: >
          dotnet test
          --runtime ${{ matrix.rid }}
          -c Release
          --no-build
          --logger "console;verbosity=detailed"

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: MossSharp/runtimes/${{ matrix.rid }}/native/
          if-no-files-found: error
          retention-days: 1

  pack:
    name: Pack NuGet Package
    needs: build-native
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MossSharp
        uses: actions/checkout@v4
        with:
          path: MossSharp

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Create runtime directories
        working-directory: MossSharp
        run: |
          mkdir -p \
            runtimes/win-x64/native \
            runtimes/linux-x64/native \
            runtimes/osx-x64/native \
            runtimes/osx-arm64/native

      - name: Download win-x64
        uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: MossSharp/runtimes/win-x64/native

      - name: Download linux-x64
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: MossSharp/runtimes/linux-x64/native

      - name: Download osx-x64
        uses: actions/download-artifact@v4
        with:
          name: native-osx-x64
          path: MossSharp/runtimes/osx-x64/native

      - name: Download osx-arm64
        uses: actions/download-artifact@v4
        with:
          name: native-osx-arm64
          path: MossSharp/runtimes/osx-arm64/native

      - name: Pack
        working-directory: MossSharp
        run: dotnet pack -c Release --no-restore

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: MossSharp/bin/Release/*.nupkg
          if-no-files-found: error
          retention-days: 30
