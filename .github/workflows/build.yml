name: Build Native Binaries & Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-native:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.rid }}

    steps:
      - name: Checkout MossSharp
        uses: actions/checkout@v4
        with:
          path: MossSharp

      - name: Checkout Moss (native)
        uses: actions/checkout@v4
        with:
          repository: TxbiG/Moss
          path: Moss
          submodules: recursive

      - name: Setup CMake
        uses: cmake-presets/action@v4
        with:
          build-type: Release

      - name: Configure Moss
        working-directory: Moss
        run: |
          cmake -S . -B build -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build Moss
        working-directory: Moss
        run: |
          cmake --build build --config Release

      - name: Verify shared library was built
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            if [ ! -f "Moss/build/Release/moss.dll" ]; then
              echo "ERROR: moss.dll not found after build"
              exit 1
            fi
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            if [ ! -f "Moss/build/libmoss.so" ]; then
              echo "ERROR: libmoss.so not found after build"
              exit 1
            fi
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            if [ ! -f "Moss/build/libmoss.dylib" ]; then
              echo "ERROR: libmoss.dylib not found after build"
              exit 1
            fi
          fi

      - name: Copy shared library to runtimes
        shell: bash
        working-directory: MossSharp
        run: |
          mkdir -p "runtimes/${{ matrix.rid }}/native"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp ../Moss/build/Release/moss.dll "runtimes/${{ matrix.rid }}/native/"
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            cp ../Moss/build/libmoss.so "runtimes/${{ matrix.rid }}/native/"
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            cp ../Moss/build/libmoss.dylib "runtimes/${{ matrix.rid }}/native/"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Build MossSharp
        working-directory: MossSharp
        run: |
          dotnet build -c Release

      - name: Run tests
        working-directory: MossSharp
        run: |
          dotnet test --runtime ${{ matrix.rid }} -c Release --no-build --logger "console;verbosity=detailed"

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: MossSharp/runtimes/${{ matrix.rid }}/native/
          retention-days: 1

  pack:
    name: Pack NuGet Package
    needs: build-native
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout MossSharp
        uses: actions/checkout@v4
        with:
          path: MossSharp

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Create runtimes directory structure
        working-directory: MossSharp
        run: |
          mkdir -p runtimes/{win-x64,linux-x64,osx-x64,osx-arm64}/native

      - name: Download win-x64 native binary
        uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: MossSharp/runtimes/win-x64/native/

      - name: Download linux-x64 native binary
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: MossSharp/runtimes/linux-x64/native/

      - name: Download osx-x64 native binary
        uses: actions/download-artifact@v4
        with:
          name: native-osx-x64
          path: MossSharp/runtimes/osx-x64/native/

      - name: Download osx-arm64 native binary
        uses: actions/download-artifact@v4
        with:
          name: native-osx-arm64
          path: MossSharp/runtimes/osx-arm64/native/

      - name: Pack NuGet package
        working-directory: MossSharp
        run: |
          dotnet pack -c Release

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: MossSharp/bin/Release/*.nupkg
          retention-days: 30
